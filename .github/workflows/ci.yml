name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  # Test-only values. Real secrets never appear in a workflow file.
  AUTH_SECRET: ci-auth-secret-value-at-least-32-characters-long
  LEDGER_CHAIN_SALT: ci-ledger-chain-salt-value
  DATABASE_URL: postgresql://carnet:carnet@localhost:5432/carnet_test?schema=public
  # Whoever runs Carnet. Without it /admin/health is unreachable by everybody,
  # which is correct behaviour and would leave the health probe unable to prove
  # that its refusals mean anything.
  OPERATOR_EMAIL: operator@carnet.test

jobs:
  # -------------------------------------------------------------------------
  # Fast feedback. Runs on every push, finishes in about a minute.
  # -------------------------------------------------------------------------
  static:
    name: Format, lint, types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      # Colour is not a matter of taste here. This resolves the design tokens
      # through their var() chains and measures every pair a component puts
      # together, in both themes, against WCAG AA.
      - name: Contrast, both themes
        run: npm run audit:theme

  # -------------------------------------------------------------------------
  # Domain tests. No database: packages/core imports nothing (ADR-0003).
  # -------------------------------------------------------------------------
  unit:
    name: Domain tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Test with coverage
        run: npm run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  # -------------------------------------------------------------------------
  # The guarantees the product's central claim rests on. This job does not
  # check that the invariants are configured; it actively tries to break them.
  # -------------------------------------------------------------------------
  integrity:
    name: Database invariants
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: carnet
          POSTGRES_PASSWORD: carnet
          POSTGRES_DB: carnet_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U carnet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Generate client and apply migrations
        run: |
          npm run db:generate
          npm run db:deploy

      - name: Seed
        run: npm run db:seed

      - name: Verify chains and invariants
        run: npx tsx infra/scripts/verify-integrity.ts

      # The runbook says untested backups are not backups. Dump the seeded
      # database with the server's own tools, restore into a fresh one, and
      # check every row came back and every chain still verifies in the copy.
      - name: Restore a backup and check it
        env:
          PG_DUMP: docker exec ${{ job.services.postgres.id }} pg_dump
          PG_RESTORE: docker exec -i ${{ job.services.postgres.id }} pg_restore
          PSQL: docker exec ${{ job.services.postgres.id }} psql
        run: npx tsx infra/scripts/verify-backup.ts

      - name: Verify inventory arithmetic
        # Reseeds first: verify-integrity leaves an account row behind, and the
        # inventory check asserts on exact opening balances.
        run: |
          npm run db:seed
          npx tsx infra/scripts/verify-inventory.ts

      # A ledger that does not balance is worse than no ledger, because every
      # figure derived from it still looks like a number.
      - name: Verify the books balance
        run: npx tsx infra/scripts/verify-ledger.ts

      # Signing up creates a workshop, not a loose account. A half-created
      # organisation is unrecoverable for the person it happens to, and this
      # also exercises erasure: an audited party must still be deletable.
      - name: Verify sign-up creates a complete workshop
        run: npx tsx infra/scripts/verify-signup.ts

      # A workshop has to be able to add its second person, and nobody may
      # hand out a role above their own.
      - name: Verify inviting, changing and removing people
        run: npx tsx infra/scripts/verify-team.ts

      # A counter sale has no job to anchor the stock movement, the cost or
      # the ledger posting, so all three have to happen on their own.
      - name: Verify a counter sale moves stock and posts to the ledger
        run: npx tsx infra/scripts/verify-counter.ts

      # A trial balance that balances proves the arithmetic was consistent,
      # not that it was right. Reconciliation is what makes it right.
      - name: Verify the bank reconciles and a period can close
        run: npx tsx infra/scripts/verify-banking.ts

      # Automation is the one feature that acts without a person in the room,
      # so the rules that stop it acting twice belong in the database rather
      # than only in the code that happens to call it.
      - name: Verify automation cannot act twice, and consent leaves a trail
        run: npx tsx infra/scripts/verify-automation.ts

      # Rows were being written to message_logs and nothing ever moved them.
      # Everything looked healthy and not one customer heard a word, so the
      # check is that a message put in comes out, not that a sender exists.
      - name: Verify a queued message actually leaves the building
        run: npx tsx infra/scripts/verify-messaging.ts

      # Six tables existed and nothing but the seed could write to them, so the
      # check walks the whole path: open one, record findings, complete it, and
      # see that what was found became a quote the customer can answer.
      - name: Verify an inspection becomes a quote
        run: npx tsx infra/scripts/verify-inspection.ts

      # A warranty is a promise the workshop is held to a year after everybody
      # has forgotten making it, so the rows outlive the code that wrote them.
      # The check is that the database itself refuses the six shapes of row
      # that would make the warranty book lie.
      - name: Verify warranty cover, claims and who owes what
        run: npx tsx infra/scripts/verify-warranty.ts

      # The condition of a vehicle is derived rather than stored, which moves
      # the risk from the arithmetic to the queries feeding it. The unit tests
      # cover the sums; this covers the joins, and that a score is never built
      # from evidence the vehicle does not have.
      - name: Verify a vehicle's condition is derived from the right records
        run: npx tsx infra/scripts/verify-condition.ts

      # A sale is where the two promises of this product meet: a history that
      # survives it, and an owner who does not. The check is that no name
      # reaches the chain, that the chain still verifies afterwards, and that a
      # vehicle with a history cannot be deleted at all.
      - name: Verify a vehicle changes hands without taking its owner with it
        run: npx tsx infra/scripts/verify-handover.ts

      # A wrong capacity figure does not appear as an error. It appears as a
      # day promised to a customer that cannot be kept, so the check is about
      # which rows are counted: not the bookkeeper's hours, not an unapproved
      # holiday, and never work given to somebody not signed off on it.
      - name: Verify capacity, skills and the proposed day
        run: npx tsx infra/scripts/verify-planning.ts

      # Two ways this leaks. One workshop reading another's history by
      # guessing an id, and a secret some caller writes into an audit payload
      # years from now reaching a screen. Both are checked against real rows.
      - name: Verify a record's history, and that a part belongs on the car
        run: npx tsx infra/scripts/verify-provenance.ts

      # The promise of offline work is that nothing is lost. The way it breaks
      # is a flush interrupted halfway and retried, writing the whole morning
      # twice, so that is what this replays against a real database.
      - name: Verify work recorded with no signal survives being sent twice
        run: npx tsx infra/scripts/verify-offline.ts

      # What embarrasses a workshop here is not arithmetic: asking the same
      # customer twice, paying a referral to one person on both sides, or
      # filing a reply against the wrong car. All three are checked against
      # real rows.
      - name: Verify asking, points, referrals and the inbox
        run: npx tsx infra/scripts/verify-retention.ts

      # Every mistake this feature makes is a quiet one: a link alive after
      # use, an old link left live when a new one is issued, a form that says
      # which addresses have accounts, or a reset that leaves the thief signed
      # in. None of them produces an error anybody would see.
      - name: Verify password reset and email verification
        run: npx tsx infra/scripts/verify-credentials.ts

      # SENT only ever meant a provider took it at the door. The ways this
      # breaks are quiet: a retried webhook suppressing twice, a full mailbox
      # treated as permanent and a real customer cut off, or a suppression
      # nothing consults at the moment of sending.
      - name: Verify bounces, complaints and suppressed addresses
        run: npx tsx infra/scripts/verify-deliverability.ts

      # The one feature where a bug hands a stranger somebody's service
      # history, declined-work list and annual mileage, from nothing but a
      # number plate read through a windscreen. Most of these checks assert
      # that nothing happened.
      - name: Verify customer sign-up and vehicle claims
        run: npx tsx infra/scripts/verify-claims.ts

      # Four controls sat on the product with nothing behind them: new
      # customer, new part, new order, send the quote. This exercises the write
      # paths that now answer them, and asserts a message somebody is waiting
      # on does not sit in the queue for a sweep that runs once a day.
      - name: Verify the write paths behind every button
        run: npx tsx infra/scripts/verify-records.ts

      # A job worked, completed, invoiced, part paid, paid, credited and
      # refunded, with the ledger checked after every step. Until Phase 16 no
      # screen could take any of these steps, so this is the first proof that a
      # workshop using the product can be paid.
      - name: Verify the money cycle
        run: npx tsx infra/scripts/verify-money.ts

      # A supplier billed, approved and paid across two bills with a remittance
      # advice; a period of hours handed to payroll as a file and marked paid;
      # a fleet's month invoiced as one document at the agreed discount.
      - name: Verify suppliers, payroll and fleet invoicing
        run: npx tsx infra/scripts/verify-erp.ts

      # Every question the command centre advertises is answered with its
      # working and agrees with the page that computes the same figure; a
      # question it cannot answer is refused; and the customer summary says
      # nothing the job does not.
      - name: Verify questions are answered from the records, or refused
        run: npx tsx infra/scripts/verify-answers.ts

      # A vehicle another workshop keeps is found by plate or VIN, taken on,
      # and its chain continued; their commercial detail is withheld; an API
      # key reads the organisation's own records and nothing beyond, and a
      # revoked one reads nothing.
      - name: Verify the network and the API
        run: npx tsx --tsconfig apps/web/tsconfig.json infra/scripts/verify-network.ts

      # The workshop configures itself: every setting saves, every bad value
      # is refused with its reason, nothing is deleted, one default tax rate
      # survives, and each change is audited with its before and after. The
      # accepted plan writes bookings the next proposal treats as fixed.
      - name: Verify settings and plan acceptance
        run: npx tsx infra/scripts/verify-settings.ts

      # Paperwork belongs to the car: the servicing workshop and the owner see
      # it, a stranger does not; bad files are refused with the reason; removal
      # keeps the row and its reason; the latest MOT decides the cover; and the
      # customer's preferred technician reaches the new-job form.
      - name: Verify the vehicle's paperwork
        run: npx tsx infra/scripts/verify-documents.ts

      # The API's document is generated from the registry beside the handlers
      # and committed; a handler without an entry, or a stale copy, fails here.
      - name: The API document describes every route
        run: npm run docs:openapi:check

      # A password that has already leaked is refused with a reason, and the
      # check fails open when the range service cannot be reached.
      - name: Verify the breached-password check
        run: npx tsx infra/scripts/verify-hardening.ts

      # The assistant composes from the record and decides nothing: a question
      # is routed as the Ask page routes it, a draft and an explanation carry
      # no figure the job does not, every exchange is recorded with its cost,
      # a spent budget falls back to the plain text, and a draft is sent once.
      - name: Verify the assistant
        run: npx tsx infra/scripts/verify-assistant.ts

      # A coupon is money off a bill that must not become money out of the
      # books: the ways it goes wrong are a discount posted as revenue and a
      # redemption counted twice.
      - name: Verify coupons
        run: npx tsx infra/scripts/verify-coupons.ts

      # Doing it twice must not do it twice. Every guard is invisible when it
      # works, which is why this asks for each write twice and compares.
      - name: Verify a repeated write does nothing twice
        run: npx tsx infra/scripts/verify-repeat.ts

      # And that every write which moves money or stock has said what a repeat
      # does to it. A write that has not declared is a write nobody checked.
      - name: Every money and stock write declares its repeat behaviour
        run: npx tsx infra/scripts/verify-writes.ts

      # Whether the books still agree with themselves, which no amount of
      # correct posting proves: the eleventh thousand posting was a migration.
      - name: Verify the books agree with themselves
        run: npx tsx infra/scripts/verify-books.ts

      # Not "a backup exists" but "Carnet was restored", with how much work was
      # lost and how long it took, measured rather than asserted.
      - name: Verify the recovery, measured
        env:
          PG_DUMP: docker exec ${{ job.services.postgres.id }} pg_dump
          PG_RESTORE: docker exec -i ${{ job.services.postgres.id }} pg_restore
          PSQL: docker exec ${{ job.services.postgres.id }} psql
        run: npx tsx infra/scripts/verify-recovery.ts

  # -------------------------------------------------------------------------
  # Production build, then every route rendered against a seeded database.
  # -------------------------------------------------------------------------
  build:
    name: Build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [static, unit]

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: carnet
          POSTGRES_PASSWORD: carnet
          POSTGRES_DB: carnet_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U carnet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Prepare database
        run: |
          npm run db:generate
          npm run db:deploy
          npm run db:seed

      - name: Build
        run: npm run build

      - name: Start the application
        run: |
          npm run start --workspace=@carnet/web &
          npx wait-on http://localhost:3000/login --timeout 90000

      - name: Smoke test every route, every role
        run: npx tsx infra/scripts/smoke.ts http://localhost:3000

      # The security model promises a Content Security Policy on every page.
      # Every response is checked for it, with a per-request nonce that the
      # page's own inline script carries and no 'unsafe-inline' for scripts.
      - name: Security headers on every response
        run: npx tsx infra/scripts/verify-headers.ts http://localhost:3000

      # Empty states are the part nobody designs, because the demo data always
      # has rows. The first person to see them is a real workshop on their
      # first morning.
      - name: Every page, with nothing in it
        run: npx tsx infra/scripts/verify-empty.ts http://localhost:3000

      # The mechanical half of accessibility: labels, names, alternatives,
      # heading order, landmarks. The failures that accumulate silently,
      # because everything looks fine to whoever is building it.
      - name: Accessibility
        run: npx tsx infra/scripts/verify-access.ts http://localhost:3000

      # Four times in one week a button turned out to have nothing behind it,
      # each found by somebody happening to press it. A control that responds
      # to nothing makes a person believe they have done something they have
      # not, and the first they learn otherwise is when the customer rings.
      - name: Every control does something, every link goes somewhere
        run: npx tsx infra/scripts/verify-controls.ts http://localhost:3000

      # The upload path has three parties and any one can be wrong in a way
      # the other two cannot see. Nothing in the application's own logs
      # distinguishes "the store refused it" from "nobody tried", which is how
      # a camera button comes to look like it works for a fortnight.
      - name: A photograph reaches the store and comes back
        run: npx tsx infra/scripts/verify-storage.ts http://localhost:3000

      # Everything built has a way in, and works when you get there. A feature
      # with no route to it is worse than one never written.
      - name: Everything built is reachable
        run: npx tsx infra/scripts/verify-wiring.ts

      # A rule a workshop writes has to actually run, from its own moment.
      - name: Automation rules fire from their moments
        run: npx tsx infra/scripts/verify-triggers.ts

      # The one failure a workshop would never forgive. Reads and writes, at
      # every address carrying an identifier, as another workshop's owner.
      - name: One workshop cannot reach another
        run: npx tsx infra/scripts/verify-tenancy.ts http://localhost:3000

      # "Why did this customer not get their message?" on a screen rather than
      # in a log, and the operator's page refusing everybody else.
      - name: How Carnet itself is, and why a message did not arrive
        run: npx tsx infra/scripts/verify-health.ts http://localhost:3000

  # -------------------------------------------------------------------------
  # Supply chain. Critical findings block the merge (NFR-409).
  # -------------------------------------------------------------------------
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Audit
        run: npm audit --audit-level=critical

      - name: Check for committed secrets
        run: |
          # Values that declare themselves placeholders are filtered out rather
          # than excluding whole files, so a real secret committed to the
          # Dockerfile would still be caught.
          if git grep -nIE '(AUTH_SECRET|LEDGER_CHAIN_SALT)=[A-Za-z0-9+/_-]{16,}' \
               -- ':!.env.example' ':!.github/workflows' \
             | grep -viE 'placeholder|replace-me|build-time'; then
            echo "::error::A secret appears to be committed."
            exit 1
          fi
          echo "No committed secrets found."
