name: CI

on:
  push:
    branches: [main]
    # A commit that only rewrites generated documents -- the deck, the design
    # book, the PDFs -- cannot change what the product does, and running a
    # browser suite over it costs real money for no information.
    paths-ignore:
      - 'docs/**/*.pdf'
      - 'docs/**/*.docx'
      - 'docs/**/*.pptx'
      - 'docs/assets/**'
      - '**/*.md'
  pull_request:
    branches: [main]
  # The heavy half runs here rather than on every push. Nightly, so a fault
  # introduced today is found before tomorrow's work is built on it.
  schedule:
    - cron: '0 3 * * *'
  # And on demand, for the push where you want the whole thing.
  workflow_dispatch:
    inputs:
      everything:
        description: 'Run the browser suite on this push'
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  # Test-only values. Real secrets never appear in a workflow file.
  AUTH_SECRET: ci-auth-secret-value-at-least-32-characters-long
  LEDGER_CHAIN_SALT: ci-ledger-chain-salt-value
  DATABASE_URL: postgresql://carnet:carnet@localhost:5432/carnet_test?schema=public
  # Whoever runs Carnet. Without it /admin/health is unreachable by everybody,
  # which is correct behaviour and would leave the health probe unable to prove
  # that its refusals mean anything.
  OPERATOR_EMAIL: operator@carnet.test
  # The stub provider signs its webhook with this. Without it verify-payments
  # skipped the signed path entirely -- so until Phase 76 nothing had ever
  # checked, anywhere, that a correctly signed webhook is applied or that a
  # replay of it changes nothing. That is money arriving.
  PAYMENT_WEBHOOK_SECRET: ci-payment-webhook-secret-value

jobs:
  # -------------------------------------------------------------------------
  # Fast feedback. Runs on every push, finishes in about a minute.
  # -------------------------------------------------------------------------
  static:
    name: Format, lint, types
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      # `tsc --build` follows project references, and three parts of this
      # repository are not references: apps/web sets `composite: false`, the
      # verification scripts were in no tsconfig at all, and the seed sits
      # outside the db package's rootDir. Each was found the same way — by
      # pointing a compiler at it and reading what came back. The web app had
      # no type gate until Phase 63; the scripts had none until Phase 65, and
      # the compiler found thirty-one errors in them.
      #
      # `npm run typecheck` runs all four now. These are named separately so a
      # failure says which part of the repository it is in.
      - name: Types, in the web app
        run: npm run typecheck:web

      - name: Types, in the verification scripts
        run: npm run typecheck:scripts

      - name: Types, in the seed
        run: npm run typecheck:prisma

      # Every sentence in the product goes through the translator, and every
      # sentence the translator is given has an answer in French and in Arabic.
      # The requirement has been in place since Phase 37.5 and this scanner
      # since Phase 40.5; until Phase 55 nothing ran it but a person typing it.
      - name: No text outside the translator
        run: npx tsx infra/scripts/i18n-scan.ts

      - name: Every refusal translated
        run: npx tsx infra/scripts/i18n-scan.ts --messages

      # And every sentence on a page has something to be translated into.
      # The two above prove a sentence went through the translator and that a
      # refusal has an answer; until Phase 62 nothing asked whether the
      # translator could answer the sentences on the pages themselves. An
      # unanswered one is shown in English, silently.
      - name: Every sentence answered in French and Arabic
        run: npx tsx infra/scripts/i18n-scan.ts --answers

      # And answered once. The dictionary is one flat map shared by every
      # page, so two areas defining the same key means the merge silently
      # keeps whichever file comes last -- which is how a courtesy car came to
      # be described to a French reader as "out of balance".
      - name: No page takes another page's words
        run: npx tsx infra/scripts/verify-dictionary.ts

      # Colour is not a matter of taste here. This resolves the design tokens
      # through their var() chains and measures every pair a component puts
      # together, in both themes, against WCAG AA.
      - name: Contrast, both themes
        run: npm run audit:theme

  # -------------------------------------------------------------------------
  # Domain tests. No database: packages/core imports nothing (ADR-0003).
  # -------------------------------------------------------------------------
  unit:
    name: Domain tests
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Test with coverage
        run: npm run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  # -------------------------------------------------------------------------
  # The guarantees the product's central claim rests on. This job does not
  # check that the invariants are configured; it actively tries to break them.
  # -------------------------------------------------------------------------
  integrity:
    name: Database invariants
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: carnet
          POSTGRES_PASSWORD: carnet
          POSTGRES_DB: carnet_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U carnet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Generate client and apply migrations
        run: |
          npm run db:generate
          npm run db:deploy

      - name: Seed
        run: npm run db:seed

      # A loading boundary flushes the response, so a page under one has
      # already answered 200 by the time it decides there is nothing there.
      # Reads the route tree; needs no database and no running application.
      - name: A page that is not there says so
        run: npx tsx infra/scripts/verify-status.ts

      # Every page in the workshop has a way in, and nobody is shown a door
      # their role would refuse. Reads the route tree and the navigation, so
      # what is checked is what is drawn.
      - name: Everything built, and a way to it
        run: npx tsx infra/scripts/verify-navigation.ts

      # Fault suggestion, built as a corpus rather than a guess: nothing is
      # shown on thin evidence, a cause never confirmed is never listed, a
      # count never appears without its refusals, and a job is not evidence
      # for itself. ADR-0016.
      - name: The corpus, not the guess
        run: npx tsx infra/scripts/verify-knowledge.ts

      # Whose move it is, derived from the job's own records rather than
      # stored: a part on order makes it the supplier's, and the moment it
      # arrives it is ours again with nothing else edited.
      - name: Where everything stands
        run: npx tsx infra/scripts/verify-standing.ts

      # FR-612 has refused to complete a job without a quality check since
      # Phase 1, and nothing could record one until Phase 85. The gate and
      # its key, end to end.
      - name: The last look before the car goes back
        run: npx tsx infra/scripts/verify-signoff.ts

      # A comeback says why, and a pattern is several cars back after the same
      # repair rather than one car back several times.
      - name: Why it came back
        run: npx tsx infra/scripts/verify-comeback.ts

      # The cheapest supplier that cannot make the promised date is not the
      # cheapest; and a substitute part is offered on evidence already in the
      # records, never on a score somebody invented.
      - name: Where to buy it
        run: npx tsx infra/scripts/verify-sourcing.ts

      # A specification sheet that fills in a plausible oil grade is worse
      # than one that says nothing: a blank sends somebody to look it up and
      # a wrong number does not.
      - name: What the car takes
        run: npx tsx infra/scripts/verify-specification.ts

      # An expired certificate takes a machine out of service by arithmetic,
      # with nobody pressing anything -- and a job whose work needs no machine
      # is never touched by the gate.
      - name: The machine the job needs
        run: npx tsx infra/scripts/verify-equipment.ts

      # An old report must be able to say what its sheet did not ask, or the
      # silence where a check used not to exist reads as a pass.
      - name: The sheet it was taken on
        run: npx tsx infra/scripts/verify-versions.ts

      # A booking three weeks out, judged against a certificate that lapses
      # before it, and reported today -- which a stored flag could never do.
      - name: Promises the workshop cannot keep
        run: npx tsx infra/scripts/verify-diary.ts

      # A scan that could mean two things asks, and never picks one: opening
      # the wrong job looks exactly like opening the right one.
      - name: What was scanned
        run: npx tsx infra/scripts/verify-scanning.ts

      # A box that is not on the order is said out loud, and a scan selects a
      # line rather than counting one -- which is how eleven of ten get booked.
      - name: The box in your hands
        run: npx tsx infra/scripts/verify-receiving.ts

      # Every row on the morning list is one action that goes somewhere that
      # exists, and every sentence it can say is answered in three languages --
      # which i18n-scan cannot see, because the library says them from inside
      # functions rather than on a page.
      - name: Do not miss
        run: npx tsx infra/scripts/verify-morning.ts

      # A close is testimony about a moment, so it must be impossible to edit
      # afterwards and impossible to take twice -- and it must change nothing
      # it reads, or it is tidying rather than recording. This asks the
      # database, in SQL, rather than asking the code that wrote it.
      - name: What was true when the doors shut
        run: npx tsx infra/scripts/verify-close.ts

      # The morning is measured against a real close, of the eight readings
      # that mean the same thing at both ends of a day -- and it writes
      # nothing, which is checked by counting rows before and after.
      - name: What happened while we were shut
        run: npx tsx infra/scripts/verify-opening.ts

      # The tower counts the building the way the board does, matches a part
      # on order to the order it is on, and writes nothing -- checked by
      # counting rows before and after, since a screen left open all day that
      # wrote anything would write it all day.
      - name: The control tower
        run: npx tsx infra/scripts/verify-tower.ts

      - name: Verify chains and invariants
        run: npx tsx infra/scripts/verify-integrity.ts

      # A passport entry's hash covers the id of the workshop that wrote it,
      # so nothing may change that column afterwards. A foreign key said
      # ON DELETE SET NULL and the append-only trigger did not list it, so
      # closing a workshop quietly broke the history of every car it had ever
      # touched. This asks the database, not the code.
      - name: The passport outlives the workshop
        run: npx tsx infra/scripts/verify-survival.ts

      # The runbook says untested backups are not backups. Dump the seeded
      # database with the server's own tools, restore into a fresh one, and
      # check every row came back and every chain still verifies in the copy.
      - name: Restore a backup and check it
        env:
          PG_DUMP: docker exec ${{ job.services.postgres.id }} pg_dump
          PG_RESTORE: docker exec -i ${{ job.services.postgres.id }} pg_restore
          PSQL: docker exec ${{ job.services.postgres.id }} psql
        run: npx tsx infra/scripts/verify-backup.ts

      - name: Verify inventory arithmetic
        # Reseeds first: verify-integrity leaves an account row behind, and the
        # inventory check asserts on exact opening balances.
        run: |
          npm run db:seed
          npx tsx infra/scripts/verify-inventory.ts

      # A ledger that does not balance is worse than no ledger, because every
      # figure derived from it still looks like a number.
      - name: Verify the books balance
        run: npx tsx infra/scripts/verify-ledger.ts

      # Signing up creates a workshop, not a loose account. A half-created
      # organisation is unrecoverable for the person it happens to, and this
      # also exercises erasure: an audited party must still be deletable.
      - name: Verify sign-up creates a complete workshop
        run: npx tsx infra/scripts/verify-signup.ts

      # A workshop has to be able to add its second person, and nobody may
      # hand out a role above their own.
      - name: Verify inviting, changing and removing people
        run: npx tsx infra/scripts/verify-team.ts

      # A counter sale has no job to anchor the stock movement, the cost or
      # the ledger posting, so all three have to happen on their own.
      - name: Verify a counter sale moves stock and posts to the ledger
        run: npx tsx infra/scripts/verify-counter.ts

      # A trial balance that balances proves the arithmetic was consistent,
      # not that it was right. Reconciliation is what makes it right.
      - name: Verify the bank reconciles and a period can close
        run: npx tsx infra/scripts/verify-banking.ts

      # Automation is the one feature that acts without a person in the room,
      # so the rules that stop it acting twice belong in the database rather
      # than only in the code that happens to call it.
      - name: Verify automation cannot act twice, and consent leaves a trail
        run: npx tsx infra/scripts/verify-automation.ts

      # Rows were being written to message_logs and nothing ever moved them.
      # Everything looked healthy and not one customer heard a word, so the
      # check is that a message put in comes out, not that a sender exists.
      - name: Verify a queued message actually leaves the building
        run: npx tsx infra/scripts/verify-messaging.ts

      # Six tables existed and nothing but the seed could write to them, so the
      # check walks the whole path: open one, record findings, complete it, and
      # see that what was found became a quote the customer can answer.
      - name: Verify an inspection becomes a quote
        run: npx tsx infra/scripts/verify-inspection.ts

      # A warranty is a promise the workshop is held to a year after everybody
      # has forgotten making it, so the rows outlive the code that wrote them.
      # The check is that the database itself refuses the six shapes of row
      # that would make the warranty book lie.
      - name: Verify warranty cover, claims and who owes what
        run: npx tsx infra/scripts/verify-warranty.ts

      # The condition of a vehicle is derived rather than stored, which moves
      # the risk from the arithmetic to the queries feeding it. The unit tests
      # cover the sums; this covers the joins, and that a score is never built
      # from evidence the vehicle does not have.
      - name: Verify a vehicle's condition is derived from the right records
        run: npx tsx infra/scripts/verify-condition.ts

      # A sale is where the two promises of this product meet: a history that
      # survives it, and an owner who does not. The check is that no name
      # reaches the chain, that the chain still verifies afterwards, and that a
      # vehicle with a history cannot be deleted at all.
      - name: Verify a vehicle changes hands without taking its owner with it
        run: npx tsx infra/scripts/verify-handover.ts

      # A wrong capacity figure does not appear as an error. It appears as a
      # day promised to a customer that cannot be kept, so the check is about
      # which rows are counted: not the bookkeeper's hours, not an unapproved
      # holiday, and never work given to somebody not signed off on it.
      - name: Verify capacity, skills and the proposed day
        run: npx tsx infra/scripts/verify-planning.ts

      # Two ways this leaks. One workshop reading another's history by
      # guessing an id, and a secret some caller writes into an audit payload
      # years from now reaching a screen. Both are checked against real rows.
      - name: Verify a record's history, and that a part belongs on the car
        run: npx tsx infra/scripts/verify-provenance.ts

      # The promise of offline work is that nothing is lost. The way it breaks
      # is a flush interrupted halfway and retried, writing the whole morning
      # twice, so that is what this replays against a real database.
      - name: Verify work recorded with no signal survives being sent twice
        run: npx tsx infra/scripts/verify-offline.ts

      # What embarrasses a workshop here is not arithmetic: asking the same
      # customer twice, paying a referral to one person on both sides, or
      # filing a reply against the wrong car. All three are checked against
      # real rows.
      - name: Verify asking, points, referrals and the inbox
        run: npx tsx infra/scripts/verify-retention.ts

      # The one mechanism every other guarantee rests on. `verify-tenancy`
      # asks for another workshop's record by id and expects not found, which
      # could never have found this: the model set the filter works from was
      # twenty-six names typed by hand, against eighty-three models carrying an
      # orgId, so fifty-seven others passed through unfiltered. /reports was
      # rendering every technician on Carnet. The set is generated from the
      # schema now, and this proves the filter is real rather than declared.
      - name: Verify the tenant filter covers what it claims to
        run: npx tsx infra/scripts/verify-scoping.ts

      # What a workshop said it would do later, and whether anybody will ever
      # see it again. A follow-up nobody does is worse than no follow-up: the
      # workshop believes it is handled and the customer knows it is not.
      - name: Verify chasing something later
        run: npx tsx infra/scripts/verify-followups.ts

      # A courtesy car promised to two people is a customer standing at the
      # counter while the car is in Leeds. Nothing recovers from it, so unlike
      # a bay clash it is refused outright -- and refused by the table, since
      # two people booking at once both read before either writes.
      - name: Verify the courtesy car
        run: npx tsx infra/scripts/verify-courtesy.ts

      # A fleet paints a number on each van and the driver who rings knows
      # nothing else. Most of these checks go through the search box rather
      # than the table, because a number nobody can look up is a column
      # somebody typed into -- and this repository has found three of those.
      - name: Verify what the fleet calls it
        run: npx tsx infra/scripts/verify-fleet-numbers.ts

      # And that the generated list is in step with the schema: a model added
      # without a decision about its tenancy fails here rather than shipping.
      - name: The tenant list matches the schema
        run: npx tsx infra/scripts/generate-tenant-models.ts --check

      # Erasure is the one feature whose failure is invisible from the outside:
      # a product that says "forgotten" and keeps the name looks exactly like
      # one that does not. So this searches every text column of every table
      # for the person's own name afterwards, and requires nothing back — and
      # then checks the books still balance and the passport still verifies,
      # because taking a person out must not take the workshop's records with
      # them.
      - name: Verify being forgotten, and what must survive it
        run: npx tsx infra/scripts/verify-erasure.ts

      # Every mistake this feature makes is a quiet one: a link alive after
      # use, an old link left live when a new one is issued, a form that says
      # which addresses have accounts, or a reset that leaves the thief signed
      # in. None of them produces an error anybody would see.
      - name: Verify password reset and email verification
        run: npx tsx infra/scripts/verify-credentials.ts

      # SENT only ever meant a provider took it at the door. The ways this
      # breaks are quiet: a retried webhook suppressing twice, a full mailbox
      # treated as permanent and a real customer cut off, or a suppression
      # nothing consults at the moment of sending.
      - name: Verify bounces, complaints and suppressed addresses
        run: npx tsx infra/scripts/verify-deliverability.ts

      # The one feature where a bug hands a stranger somebody's service
      # history, declined-work list and annual mileage, from nothing but a
      # number plate read through a windscreen. Most of these checks assert
      # that nothing happened.
      - name: Verify customer sign-up and vehicle claims
        run: npx tsx infra/scripts/verify-claims.ts

      # Four controls sat on the product with nothing behind them: new
      # customer, new part, new order, send the quote. This exercises the write
      # paths that now answer them, and asserts a message somebody is waiting
      # on does not sit in the queue for a sweep that runs once a day.
      - name: Verify the write paths behind every button
        run: npx tsx infra/scripts/verify-records.ts

      # A job worked, completed, invoiced, part paid, paid, credited and
      # refunded, with the ledger checked after every step. Until Phase 16 no
      # screen could take any of these steps, so this is the first proof that a
      # workshop using the product can be paid.
      - name: Verify the money cycle
        run: npx tsx infra/scripts/verify-money.ts

      # A supplier billed, approved and paid across two bills with a remittance
      # advice; a period of hours handed to payroll as a file and marked paid;
      # a fleet's month invoiced as one document at the agreed discount.
      - name: Verify suppliers, payroll and fleet invoicing
        run: npx tsx infra/scripts/verify-erp.ts

      # Every question the command centre advertises is answered with its
      # working and agrees with the page that computes the same figure; a
      # question it cannot answer is refused; and the customer summary says
      # nothing the job does not.
      - name: Verify questions are answered from the records, or refused
        run: npx tsx infra/scripts/verify-answers.ts

      # A vehicle another workshop keeps is found by plate or VIN, taken on,
      # and its chain continued; their commercial detail is withheld; an API
      # key reads the organisation's own records and nothing beyond, and a
      # revoked one reads nothing.
      - name: Verify the network and the API
        run: npx tsx --tsconfig apps/web/tsconfig.json infra/scripts/verify-network.ts

      # The workshop configures itself: every setting saves, every bad value
      # is refused with its reason, nothing is deleted, one default tax rate
      # survives, and each change is audited with its before and after. The
      # accepted plan writes bookings the next proposal treats as fixed.
      - name: Verify settings and plan acceptance
        run: npx tsx infra/scripts/verify-settings.ts

      # Paperwork belongs to the car: the servicing workshop and the owner see
      # it, a stranger does not; bad files are refused with the reason; removal
      # keeps the row and its reason; the latest MOT decides the cover; and the
      # customer's preferred technician reaches the new-job form.
      - name: Verify the vehicle's paperwork
        run: npx tsx infra/scripts/verify-documents.ts

      # The API's document is generated from the registry beside the handlers
      # and committed; a handler without an entry, or a stale copy, fails here.
      - name: The API document describes every route
        run: npm run docs:openapi:check

      # A password that has already leaked is refused with a reason, and the
      # check fails open when the range service cannot be reached.
      - name: Verify the breached-password check
        run: npx tsx infra/scripts/verify-hardening.ts

      # The assistant composes from the record and decides nothing: a question
      # is routed as the Ask page routes it, a draft and an explanation carry
      # no figure the job does not, every exchange is recorded with its cost,
      # a spent budget falls back to the plain text, and a draft is sent once.
      - name: Verify the assistant
        run: npx tsx infra/scripts/verify-assistant.ts

      # A coupon is money off a bill that must not become money out of the
      # books: the ways it goes wrong are a discount posted as revenue and a
      # redemption counted twice.
      - name: Verify coupons
        run: npx tsx infra/scripts/verify-coupons.ts

      # Doing it twice must not do it twice. Every guard is invisible when it
      # works, which is why this asks for each write twice and compares.
      - name: Verify a repeated write does nothing twice
        run: npx tsx infra/scripts/verify-repeat.ts

      # And that every write which moves money or stock has said what a repeat
      # does to it. A write that has not declared is a write nobody checked.
      - name: Every money and stock write declares its repeat behaviour
        run: npx tsx infra/scripts/verify-writes.ts

      # Whether the books still agree with themselves, which no amount of
      # correct posting proves: the eleventh thousand posting was a migration.
      - name: Verify the books agree with themselves
        run: npx tsx infra/scripts/verify-books.ts

      # The workshop's own elapsed times, and that each is read from the two
      # moments it claims to read rather than from a plausible-looking pair.
      - name: The workshop's own clock
        run: npx tsx infra/scripts/verify-clock.ts

      # The thirteen things a tidy flowchart does not expect, each held to the
      # decision written down for it rather than to whatever the code does.
      - name: The awkward cases
        run: npx tsx infra/scripts/verify-awkward.ts

      # Seven phases' own checks that were written, wired to an npm script, and
      # then never run by anything. Each was green the day it was written and
      # nothing has asked since.
      - name: Points, referrals and gift cards
        run: |
          npx tsx infra/scripts/verify-loyalty.ts
          npx tsx infra/scripts/verify-referrals.ts
          npx tsx infra/scripts/verify-giftcards.ts

      - name: Country, currency and money held ahead
        run: |
          npx tsx infra/scripts/verify-region.ts
          npx tsx infra/scripts/verify-deposits.ts

      - name: The customer's own account, and data brought in
        run: |
          npx tsx infra/scripts/verify-portal-account.ts
          npx tsx infra/scripts/verify-import.ts

      - name: The passport, listed
        run: npx tsx infra/scripts/verify-passports.ts

      # Every setting the application reads says what a workshop would feel
      # without it. The judgement about one deployment is npm run
      # launch:handover, run against that deployment before a first morning —
      # deliberately not here, where it would fail for ever and teach
      # everybody to ignore it.
      - name: Every setting is accounted for
        run: npx tsx infra/scripts/verify-launch.ts

      # Whether a workshop could be handed this on Monday: each of the pilot's
      # four findings has a source, and every audited action belongs to a
      # capability somebody would name, so nothing goes uncounted at the
      # debrief.
      - name: Ready to hand over
        run: npx tsx infra/scripts/verify-pilot.ts

      # Not "a backup exists" but "Carnet was restored", with how much work was
      # lost and how long it took, measured rather than asserted.
      - name: Verify the recovery, measured
        env:
          PG_DUMP: docker exec ${{ job.services.postgres.id }} pg_dump
          PG_RESTORE: docker exec -i ${{ job.services.postgres.id }} pg_restore
          PSQL: docker exec ${{ job.services.postgres.id }} psql
        run: npx tsx infra/scripts/verify-recovery.ts

  # -------------------------------------------------------------------------
  # Production build, then every route rendered against a seeded database.
  # -------------------------------------------------------------------------
  # The expensive one, and the reason this file was restructured in Phase 82.
  #
  # It builds the application and runs sixty-odd checks through three browser
  # engines: the screens at four sizes, the paint budget, every route for every
  # role. Ten to twenty minutes of runner time, every push, on a private
  # repository where those minutes are billed -- and the account's allowance ran
  # out mid-session, which stops every job including the cheap ones that would
  # have caught most faults.
  #
  # So it runs where it earns its cost: on a pull request, nightly, and on
  # demand. A push straight to main gets the fast gates, and the browser suite
  # follows within the day.
  #
  # `runs-on` reads a repository variable first: set HEAVY_RUNNER to
  # `self-hosted` with a runner registered on your own machine and this job
  # costs nothing at all, because self-hosted minutes are not billed. The
  # fallback is the hosted runner, so the file works unchanged either way.
  build:
    name: Build and smoke test
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ${{ vars.HEAVY_RUNNER || vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    needs: [static, unit]

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: carnet
          POSTGRES_PASSWORD: carnet
          POSTGRES_DB: carnet_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U carnet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Prepare database
        run: |
          npm run db:generate
          npm run db:deploy
          npm run db:seed

      - name: Build
        run: npm run build

      - name: Start the application
        run: |
          npm run start --workspace=@carnet/web &
          npx wait-on http://localhost:3000/login --timeout 90000

      - name: Smoke test every route, every role
        run: npx tsx infra/scripts/smoke.ts http://localhost:3000

      # The security model promises a Content Security Policy on every page.
      # Every response is checked for it, with a per-request nonce that the
      # page's own inline script carries and no 'unsafe-inline' for scripts.
      - name: Security headers on every response
        run: npx tsx infra/scripts/verify-headers.ts http://localhost:3000

      # Empty states are the part nobody designs, because the demo data always
      # has rows. The first person to see them is a real workshop on their
      # first morning.
      - name: Every page, with nothing in it
        run: npx tsx infra/scripts/verify-empty.ts http://localhost:3000

      # The mechanical half of accessibility: labels, names, alternatives,
      # heading order, landmarks. The failures that accumulate silently,
      # because everything looks fine to whoever is building it.
      - name: Accessibility
        run: npx tsx infra/scripts/verify-access.ts http://localhost:3000

      # Four times in one week a button turned out to have nothing behind it,
      # each found by somebody happening to press it. A control that responds
      # to nothing makes a person believe they have done something they have
      # not, and the first they learn otherwise is when the customer rings.
      - name: Every control does something, every link goes somewhere
        run: npx tsx infra/scripts/verify-controls.ts http://localhost:3000

      # The upload path has three parties and any one can be wrong in a way
      # the other two cannot see. Nothing in the application's own logs
      # distinguishes "the store refused it" from "nobody tried", which is how
      # a camera button comes to look like it works for a fortnight.
      - name: A photograph reaches the store and comes back
        run: npx tsx infra/scripts/verify-storage.ts http://localhost:3000

      # Everything built has a way in, and works when you get there. A feature
      # with no route to it is worse than one never written.
      - name: Everything built is reachable
        run: npx tsx infra/scripts/verify-wiring.ts

      # A rule a workshop writes has to actually run, from its own moment.
      - name: Automation rules fire from their moments
        run: npx tsx infra/scripts/verify-triggers.ts

      # The one failure a workshop would never forgive. Reads and writes, at
      # every address carrying an identifier, as another workshop's owner.
      - name: One workshop cannot reach another
        run: npx tsx infra/scripts/verify-tenancy.ts http://localhost:3000

      # Every screen at every size. Built in Phase 46.5, never run by anything
      # until Phase 55, by which time it had twenty faults waiting on pages
      # that had been measured by nobody since the day they were written.
      # Every engine any check launches, installed once, before the first
      # of them runs. Chromium was assumed to be there because it is what
      # Playwright installs by default -- but nothing here had asked it to
      # install anything, and the only install in this file named webkit and
      # firefox, which replaces the default set rather than adding to it, and
      # ran after the checks that needed Chromium. The screens check had been
      # failing on a missing browser.
      - name: The browsers the checks launch
        run: npx playwright install --with-deps chromium webkit firefox

      - name: Every screen at every size
        run: npx tsx infra/scripts/verify-screens.ts http://localhost:3000

      # A person on two workshops' teams is two tenants meeting in one account,
      # which is where this product's worst defect would live. Nobody is placed
      # in a workshop silently, nothing the request carries decides which one,
      # the role and the records move together, and one workshop's decisions
      # stop at its own boundary. Given an address it also renders the chooser,
      # which `verify-screens` cannot: its people are on one team, so the page
      # correctly redirects rather than asking.
      - name: Verify working at two workshops
        run: npx tsx infra/scripts/verify-belonging.ts http://localhost:3000

      # Everything else here is measured in Chromium because that is what
      # Playwright installs by default. A workshop's customers open a shared
      # passport on their own telephone, and a great many of those telephones
      # are iPhones, which is WebKit — a different engine, not a different skin.
      - name: The same screens in Safari and Firefox
        run: npx tsx infra/scripts/verify-engines.ts http://localhost:3000

      # Every sentence in French and in Arabic, and the switch that changes
      # them. This one had been failing since Phase 50 and nothing said so.
      - name: Every word translated
        run: npx tsx infra/scripts/verify-languages.ts http://localhost:3000

      - name: Permissions at the resource, and the plan enforced
        run: npx tsx infra/scripts/verify-authz.ts http://localhost:3000

      - name: Card payments, and the subscription billed
        run: |
          npx tsx infra/scripts/verify-payments.ts http://localhost:3000
          npx tsx infra/scripts/verify-billing.ts http://localhost:3000

      - name: The workflow, arrival and departure, and conversations
        run: |
          npx tsx infra/scripts/verify-workflow.ts http://localhost:3000
          npx tsx infra/scripts/verify-arrival.ts http://localhost:3000
          npx tsx infra/scripts/verify-conversations.ts http://localhost:3000

      - name: Packages, parts back, and finding anything
        run: |
          npx tsx infra/scripts/verify-packages.ts http://localhost:3000
          npx tsx infra/scripts/verify-returns.ts http://localhost:3000
          npx tsx infra/scripts/verify-search.ts http://localhost:3000

      - name: The owner's day, tax, and paper
        run: |
          npx tsx infra/scripts/verify-owner.ts http://localhost:3000
          npx tsx infra/scripts/verify-tax.ts http://localhost:3000
          npx tsx infra/scripts/verify-paper.ts http://localhost:3000

      - name: Providers, ownership, and the first day
        run: |
          npx tsx infra/scripts/verify-providers.ts http://localhost:3000
          npx tsx infra/scripts/verify-ownership.ts http://localhost:3000
          npx tsx infra/scripts/verify-first-day.ts http://localhost:3000

      # A budget per screen. On a seeded workshop it says the harness works
      # rather than that the product is quick, and it says so itself.
      - name: A budget per screen
        run: npx tsx infra/scripts/verify-performance.ts http://localhost:3000

      # The other half of what a person waits for: not how long the server
      # took, but how long after that the screen showed the thing, and whether
      # it held still. Measured over a throttled connection on a slowed
      # processor, three runs a screen, which costs about four minutes.
      - name: What the screen does while somebody waits
        run: npx tsx infra/scripts/verify-paint.ts http://localhost:3000

      # The four claims the roadmap makes about every phase rather than about
      # any one of them, which nothing had ever checked.
      - name: The four things that are not features
        run: npx tsx infra/scripts/verify-throughout.ts

      # Whether the traceability matrix is true: every requirement has a row,
      # every test a row names exists, and every function a row names exists
      # in the source. A matrix is the easiest document in a project to write
      # falsely, because a row naming something that was renamed two years ago
      # reads exactly like a row naming something that is there.
      - name: The matrix says what is true
        run: npx tsx infra/scripts/verify-traceability.ts

      # And the other half of the requirements: eighty-four quality budgets,
      # each accounted for as checked, read off the repository, or not yet —
      # with what it would take written down.
      - name: Every quality requirement is accounted for
        run: npx tsx infra/scripts/verify-quality.ts

      # One press, followed all the way through: the record, the queued event,
      # the message, and the note on somebody's screen. NFR-803, which had
      # never existed.
      - name: A press can be followed to the inbox
        run: npx tsx infra/scripts/verify-trace.ts http://localhost:3000

      # Whether anybody would actually be told. A page is the right thing to
      # look at once you know something is wrong; this is the part that makes
      # you know, and it had never existed.
      - name: Somebody would be told
        run: npx tsx infra/scripts/verify-alerts.ts

      # "Why did this customer not get their message?" on a screen rather than
      # in a log, and the operator's page refusing everybody else.
      - name: How Carnet itself is, and why a message did not arrive
        run: npx tsx infra/scripts/verify-health.ts http://localhost:3000

  # -------------------------------------------------------------------------
  # Supply chain. Critical findings block the merge (NFR-409).
  # -------------------------------------------------------------------------
  audit:
    name: Dependency audit
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Audit
        run: npm audit --audit-level=critical

      - name: Check for committed secrets
        run: |
          # Values that declare themselves placeholders are filtered out rather
          # than excluding whole files, so a real secret committed to the
          # Dockerfile would still be caught.
          if git grep -nIE '(AUTH_SECRET|LEDGER_CHAIN_SALT)=[A-Za-z0-9+/_-]{16,}' \
               -- ':!.env.example' ':!.github/workflows' \
             | grep -viE 'placeholder|replace-me|build-time'; then
            echo "::error::A secret appears to be committed."
            exit 1
          fi
          echo "No committed secrets found."
